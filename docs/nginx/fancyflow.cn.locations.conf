# Include this inside the `fancyflow.cn` server block (or paste the locations).
#
# Server-level defaults (add once, before the locations):
#   expires -1;          # HTML revalidates on every visit
#   http2 on;            # nginx >= 1.25.1; older: use `listen 443 ssl http2;`
#
# Hashed build assets can be cached for a year.
location ^~ /_astro/ {
    expires 1y;
}

# Pagefind chunks are versioned per build; a week is plenty.
location ^~ /pagefind/ {
    expires 7d;
}

# Assets live outside the webroot and are served same-origin so pages avoid a
# second DNS + TLS handshake. Create the directory (or move it, see README.md)
# before reloading nginx — `alias` does not fall back to the webroot.
location ^~ /image/ {
    alias /var/www/cdn-fancyflow.cn/image/;
    expires 7d;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /musics/ {
    alias /var/www/cdn-fancyflow.cn/musics/;
    expires 7d;
    add_header X-Content-Type-Options "nosniff" always;
}
