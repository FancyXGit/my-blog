# cdn.fancyflow.cn — static assets for the mainland build (fancyflow.cn)
#
# Install (needs root):
#   1) sudo certbot certonly --nginx -d cdn.fancyflow.cn     # issue the certificate first
#   2) sudo cp docs/cdn-nginx.conf /etc/nginx/sites-available/cdn.fancyflow.cn
#   3) sudo ln -s /etc/nginx/sites-available/cdn.fancyflow.cn /etc/nginx/sites-enabled/
#   4) sudo nginx -t && sudo systemctl reload nginx
#
# Files are uploaded by scripts/upload-to-r2.cjs (SFTP, CN_ASSET_ROOT) and live
# next to the site: /var/www/fancyflow.cn/image/... and /var/www/fancyflow.cn/musics/...
# The .cn deploy workflow excludes those two directories from `rsync --delete`.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cdn.fancyflow.cn;

    ssl_certificate /etc/letsencrypt/live/cdn.fancyflow.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.fancyflow.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/fancyflow.cn;
    autoindex off;
    charset utf-8;

    # This host only serves assets; never expose the site's HTML/XML here.
    location = / {
        return 404;
    }

    location ~* \.(html|xml)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;

        # Assets are content-addressed by path and never rewritten in place.
        expires 30d;

        # The music player fetches .lrc files from the page origin (fancyflow.cn),
        # so lyric files need CORS. Harmless for images/audio.
        add_header Access-Control-Allow-Origin "*" always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cdn.fancyflow.cn;

    # Keep the ACME path usable so certbot webroot renewals don't depend on TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/fancyflow.cn;
    }

    location / {
        return 301 https://cdn.fancyflow.cn$request_uri;
    }
}
