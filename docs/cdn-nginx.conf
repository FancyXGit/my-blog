# cdn.fancyflow.cn — dedicated asset host for the mainland deployment.
#
# Assets live in /var/www/cdn-fancyflow.cn/{image,musics} (outside the site
# webroot). The site itself serves the same files same-origin through `alias`
# (see docs/nginx/fancyflow.cn.conf); this vhost stays available for direct
# links and a future real mainland CDN.
#
# Install / refresh (needs root):
#   sudo cp docs/cdn-nginx.conf /etc/nginx/sites-available/cdn.fancyflow.cn
#   sudo nginx -t && sudo systemctl reload nginx
#
# Keep this file in sync with docs/server/apply-cn-nginx.sh.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.fancyflow.cn;

    ssl_certificate /etc/letsencrypt/live/cdn.fancyflow.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.fancyflow.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/cdn-fancyflow.cn;
    autoindex off;
    charset utf-8;

    # This host only serves assets; never expose the site's HTML/XML here.
    location = / {
        return 404;
    }

    location ~* \.(html|xml)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        # Asset paths are stable but can be overwritten by re-uploads, so keep a
        # moderate TTL instead of `immutable`.
        add_header Cache-Control "public, max-age=604800" always;
        # Direct asset-host usage needs CORS for the music player's .lrc files.
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cdn.fancyflow.cn;

    # ACME challenges stay in the site webroot (excluded from rsync --delete).
    location /.well-known/acme-challenge/ {
        root /var/www/fancyflow.cn;
    }

    location / {
        return 301 https://cdn.fancyflow.cn$request_uri;
    }
}
