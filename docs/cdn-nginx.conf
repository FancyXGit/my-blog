# cdn.fancyflow.cn — dedicated asset host for the mainland deployment
#
# Install (needs root):
#   1) sudo certbot certonly --nginx -d cdn.fancyflow.cn     # issue the certificate first
#   2) sudo cp docs/cdn-nginx.conf /etc/nginx/sites-available/cdn.fancyflow.cn
#   3) sudo ln -s /etc/nginx/sites-available/cdn.fancyflow.cn /etc/nginx/sites-enabled/
#   4) sudo nginx -t && sudo systemctl reload nginx
#
# Files are uploaded by scripts/upload-to-r2.cjs (SFTP, CN_ASSET_ROOT) and live
# outside the site webroot: /var/www/cdn-fancyflow.cn/{image,musics}. The site
# itself serves them same-origin through `alias` (see docs/nginx/README.md); this
# vhost stays available for direct links and a future real mainland CDN.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.fancyflow.cn;

    ssl_certificate /etc/letsencrypt/live/cdn.fancyflow.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.fancyflow.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/cdn-fancyflow.cn;
    autoindex off;
    charset utf-8;

    # This host only serves assets; never expose the site's HTML/XML here.
    location = / {
        return 404;
    }

    location ~* \.(html|xml)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;

        # Asset paths are stable but can be overwritten by re-uploads, so keep the
        # TTL moderate instead of `immutable`.
        expires 7d;

        # The music player fetches .lrc files cross-origin when the asset host is
        # used directly, so lyric files need CORS. Harmless for images/audio.
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cdn.fancyflow.cn;

    # Keep the ACME path usable so certbot webroot renewals don't depend on TLS.
    # The challenge files stay in the site webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/fancyflow.cn;
    }

    location / {
        return 301 https://cdn.fancyflow.cn$request_uri;
    }
}
