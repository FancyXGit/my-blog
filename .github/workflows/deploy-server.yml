name: Deploy Blog

on:
  push:
    branches:
      - main
    paths-ignore:
      - "worker/**"
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
  workflow_dispatch:

concurrency:
  group: deploy-blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CN + Top
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      # Primary mainland site: same-origin assets, canonical origin = fancyflow.cn.
      - name: Build (cn)
        run: pnpm build

      # Overseas mirror: R2 assets, but canonical still points to fancyflow.cn.
      # Webmentions only exist on this variant; keep the env scoped to this step.
      - name: Build (top)
        run: pnpm build:top
        env:
          WEBMENTION_API_KEY: ${{ secrets.WEBMENTION_API_KEY }}
          WEBMENTION_URL: ${{ secrets.WEBMENTION_URL }}
          WEBMENTION_PINGBACK: ${{ secrets.WEBMENTION_PINGBACK }}

      - name: Upload CN artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-cn
          path: dist
          if-no-files-found: error
          retention-days: 3

      - name: Upload Top artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-top
          path: dist-top
          if-no-files-found: error
          retention-days: 3

  deploy-cn:
    name: Deploy CN (primary)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-cn
      url: https://fancyflow.cn
    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-cn
          path: dist-cn

      - name: Snapshot current site
        uses: appleboy/ssh-action@v1.2.0
        env:
          WEB_ROOT: ${{ secrets.CN_WEB_ROOT }}
        with:
          host: ${{ secrets.CN_SERVER_HOST }}
          username: ${{ secrets.CN_SERVER_USER }}
          key: ${{ secrets.CN_SERVER_SSH_KEY }}
          port: ${{ secrets.CN_SERVER_PORT || 22 }}
          envs: WEB_ROOT
          script_stop: true
          script: |
            set -e
            WEB_ROOT="${WEB_ROOT%/}"
            if [ -z "$WEB_ROOT" ] || [ "$WEB_ROOT" = "/" ]; then
              echo "Invalid CN_WEB_ROOT: '$WEB_ROOT'"
              exit 1
            fi
            if [ ! -d "$WEB_ROOT" ]; then
              echo "Web root does not exist yet; skipping snapshot."
              exit 0
            fi
            BACKUP_ROOT="$(dirname "$WEB_ROOT")/.releases"
            if ! mkdir -p "$BACKUP_ROOT" 2>/dev/null; then
              echo "Cannot create $BACKUP_ROOT; skipping snapshot."
              exit 0
            fi
            SNAPSHOT="$BACKUP_ROOT/site-$(date -u +%Y%m%d-%H%M%S)"
            if ! cp -al "$WEB_ROOT" "$SNAPSHOT" 2>/dev/null; then
              echo "Hardlink snapshot failed; trying a full copy."
              rm -rf "$SNAPSHOT"
              if ! cp -a "$WEB_ROOT" "$SNAPSHOT" 2>/dev/null; then
                echo "Snapshot failed; continuing without one."
                exit 0
              fi
            fi
            ls -1dt "$BACKUP_ROOT"/site-* 2>/dev/null | tail -n +4 | xargs -r rm -rf
            echo "Snapshot: $SNAPSHOT"

      # image/ and musics/ live outside the webroot after the asset cutover; the
      # excludes are kept as a safety net for servers that have not migrated yet.
      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude=/.well-known/ --exclude=/image/ --exclude=/musics/
          path: dist-cn/
          remote_path: ${{ secrets.CN_WEB_ROOT }}/
          remote_host: ${{ secrets.CN_SERVER_HOST }}
          remote_user: ${{ secrets.CN_SERVER_USER }}
          remote_key: ${{ secrets.CN_SERVER_SSH_KEY }}
          remote_port: ${{ secrets.CN_SERVER_PORT || 22 }}

  deploy-top:
    name: Deploy Top (mirror)
    needs: build
    if: vars.DEPLOY_TOP != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-top
      url: https://fancyflow.top
    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-top
          path: dist-top

      - name: Snapshot current site
        uses: appleboy/ssh-action@v1.2.0
        env:
          WEB_ROOT: ${{ secrets.SERVER_WEB_ROOT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: WEB_ROOT
          script_stop: true
          script: |
            set -e
            WEB_ROOT="${WEB_ROOT%/}"
            if [ -z "$WEB_ROOT" ] || [ "$WEB_ROOT" = "/" ]; then
              echo "Invalid SERVER_WEB_ROOT: '$WEB_ROOT'"
              exit 1
            fi
            if [ ! -d "$WEB_ROOT" ]; then
              echo "Web root does not exist yet; skipping snapshot."
              exit 0
            fi
            BACKUP_ROOT="$(dirname "$WEB_ROOT")/.releases"
            if ! mkdir -p "$BACKUP_ROOT" 2>/dev/null; then
              echo "Cannot create $BACKUP_ROOT; skipping snapshot."
              exit 0
            fi
            SNAPSHOT="$BACKUP_ROOT/site-$(date -u +%Y%m%d-%H%M%S)"
            if ! cp -al "$WEB_ROOT" "$SNAPSHOT" 2>/dev/null; then
              echo "Hardlink snapshot failed; trying a full copy."
              rm -rf "$SNAPSHOT"
              if ! cp -a "$WEB_ROOT" "$SNAPSHOT" 2>/dev/null; then
                echo "Snapshot failed; continuing without one."
                exit 0
              fi
            fi
            ls -1dt "$BACKUP_ROOT"/site-* 2>/dev/null | tail -n +4 | xargs -r rm -rf
            echo "Snapshot: $SNAPSHOT"

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude=/.well-known/
          path: dist-top/
          remote_path: ${{ secrets.SERVER_WEB_ROOT }}/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
          remote_port: ${{ secrets.SERVER_PORT || 22 }}
